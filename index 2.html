<style>
:root{
  --pink:#ffd6e7;--pink2:#ff8fb8;--lav:#e6dcff;--lav2:#a98bff;--mint:#c9f2e3;--mint2:#45c79a;
  --sky:#d3ebff;--sky2:#5aaeff;--lemon:#fff3b8;--lemon2:#ffc93c;--peach:#ffe0cc;--peach2:#ff9b6a;
  --ink:#5a4a78;--ink2:#8a7aa8;--white:#fff;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--pink);
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
body{position:fixed;inset:0;font-family:var(--font);color:var(--ink);font-weight:700}
button{font-family:inherit;font-weight:800;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
input{font-family:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
#app{position:absolute;inset:0;max-width:560px;margin:0 auto;overflow:hidden;
  background:linear-gradient(160deg,#ffe3ef,#eadfff 55%,#d9efff)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.screen.active{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.scroll-x{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior:contain;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.btn{min-height:48px;min-width:48px;border-radius:18px;padding:10px 16px;font-size:17px;
  background:#fff;box-shadow:0 4px 0 rgba(90,74,120,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,74,120,.18)}
.btn.icon{padding:0;width:48px;height:48px;font-size:24px;border-radius:50%;flex:0 0 auto}
.btn.big{min-height:58px;font-size:20px;border-radius:22px;padding:12px 22px}
.btn.pink{background:var(--pink2);color:#fff}.btn.lav{background:var(--lav2);color:#fff}
.btn.mint{background:var(--mint2);color:#fff}.btn.sky{background:var(--sky2);color:#fff}
.btn.lemon{background:var(--lemon2)}.btn.peach{background:var(--peach2);color:#fff}
.btn:disabled{opacity:.45}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:16px;box-shadow:0 3px 0 rgba(90,74,120,.12);white-space:nowrap}
/* emoji icon */
.ico{position:relative;display:inline-block;line-height:1;font-style:normal}
.ico .ie{display:inline-block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ico .ib{position:absolute;right:-.18em;bottom:-.08em;font-size:.45em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
/* ---------- title ---------- */
#scrTitle{align-items:center;justify-content:center;text-align:center;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,#fff6fb,#ffd6e7 45%,#d9cbff 100%)}
.titleText{font-size:clamp(40px,13vw,68px);line-height:1.02;font-weight:900;letter-spacing:1px;margin:0 16px 18px;
  text-shadow:0 4px 0 #fff,0 7px 0 rgba(90,74,120,.18)}
.titleText .w{display:block}
.titleText span.l{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tapStart{font-size:24px;background:#fff;padding:14px 30px;border-radius:999px;box-shadow:0 5px 0 rgba(90,74,120,.2);
  animation:pulse 1.4s ease-in-out infinite;margin-top:12px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.titlePets{font-size:52px;height:70px;margin-bottom:10px}
.titlePets span{display:inline-block;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}}
.floaty{position:absolute;font-size:34px;opacity:.55;animation:floaty 7s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-24px) rotate(10deg)}}
.titleSub{font-size:16px;color:var(--ink2);margin-top:22px}
/* ---------- bars ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px}
.bar h2{flex:1;margin:0;font-size:22px;text-align:center}
.searchRow{padding:0 12px 6px}
#search{width:100%;height:50px;border:3px solid #fff;border-radius:18px;padding:0 16px;background:#fff8fc;color:var(--ink);font-weight:700;outline:none}
#search:focus{border-color:var(--pink2)}
.tabs{display:flex;gap:6px;padding:4px 12px 8px;flex-wrap:nowrap}
.tab{flex:0 0 auto;min-height:44px;padding:8px 14px;border-radius:999px;background:#fff;font-size:15px;box-shadow:0 3px 0 rgba(90,74,120,.12)}
.tab.on{background:var(--lav2);color:#fff}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;padding:4px 12px 20px;align-content:start}
.card{background:#fff;border-radius:20px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;box-shadow:0 4px 0 rgba(90,74,120,.12)}
.card .ico{font-size:44px}
.card .nm{font-size:12.5px;text-align:center;line-height:1.1}
.card.f{background:linear-gradient(160deg,#fff,#f3ecff)}
.card[hidden]{display:none}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;font-size:18px;color:var(--ink2)}
/* ---------- pet screen ---------- */
.top{padding:6px 8px 2px}
.petTabs{flex:1;display:flex;gap:6px;padding:4px 2px}
.ptab{flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(90,74,120,.15);border:3px solid transparent;padding:0}
.ptab.on{border-color:var(--pink2);background:#fff0f6}
.ptab.add{font-size:24px;color:var(--ink2);background:rgba(255,255,255,.7)}
.coins{font-size:17px}
.nameRow{display:flex;align-items:center;gap:8px;padding:2px 14px 4px}
#petName{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#petLevel{font-size:13px;background:var(--lemon);border-radius:999px;padding:4px 10px;white-space:nowrap}
.xpbar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;min-width:40px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd75e,#ffb13c);border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;padding:2px 14px 6px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px}
.stat .si{font-size:18px;width:22px;text-align:center}
.stat .sl{width:46px}
.stat .sb{flex:1;height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.stat .sb i{display:block;height:100%;border-radius:99px;transition:width .6s,background .6s}
.stat.low .sb{animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 3px rgba(255,90,120,.45)}}
.stat.full{grid-column:1/-1}
.stage{position:relative;flex:1;margin:0 10px;border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7);touch-action:none;min-height:200px}
.room{position:absolute;inset:0;transition:background .5s}
.deco{position:absolute;line-height:1;pointer-events:none;transform:translate(-50%,-50%)}
.petWrap{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.petAct{transform-origin:50% 100%}
.petBody{position:relative;line-height:1;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite;cursor:pointer}
.petBody .ico .ib{font-size:.32em}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6%) scale(1.03,.97)}}
.petBody.happy{animation:happyBob 1.3s ease-in-out infinite}
@keyframes happyBob{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-12%) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.95)}}
.petBody.sad{animation:droop 3.4s ease-in-out infinite}
.petBody.sad .pe{filter:saturate(.6) brightness(.95)}
@keyframes droop{0%,100%{transform:translateY(4%) rotate(-3deg) scale(1.02,.94)}50%{transform:translateY(6%) rotate(3deg) scale(1.03,.92)}}
.petBody.sick .pe{filter:saturate(.45) hue-rotate(40deg) brightness(.95)}
.petBody.sleep{animation:sleepy 4s ease-in-out infinite}
@keyframes sleepy{0%,100%{transform:translateY(8%) rotate(-8deg) scale(1.04,.9)}50%{transform:translateY(8%) rotate(-8deg) scale(1.08,.86)}}
.petBody.blink{transform:scale(1.04,.9)!important}
.pe{display:inline-block}
.acc{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;line-height:1}
.acc.head{top:-.36em;font-size:.48em;transform:translateX(-50%) rotate(-8deg)}
.acc.face{top:.25em;font-size:.44em}
.acc.neck{top:.74em;font-size:.36em}
.mood{position:absolute;right:10%;top:12%;font-size:34px;background:#fff;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(90,74,120,.15);pointer-events:none}
.spouse{position:absolute;left:8%;bottom:9%;font-size:54px;pointer-events:none;animation:breathe 3s ease-in-out infinite}
.spouse .heart{position:absolute;right:-14px;top:-12px;font-size:22px}
#speech{position:absolute;left:50%;top:6%;transform:translateX(-50%) scale(0);background:#fff;padding:10px 16px;border-radius:20px;font-size:17px;white-space:nowrap;box-shadow:0 4px 0 rgba(90,74,120,.15);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#speech.show{transform:translateX(-50%) scale(1)}
#speech:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
#night{position:absolute;inset:0;background:rgba(20,20,70,.6);opacity:0;pointer-events:none;transition:opacity 1s}
#night.on{opacity:1}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floatUp{position:absolute;font-size:30px;pointer-events:none;will-change:transform,opacity}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 8px calc(8px + 2px)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border-radius:20px;background:#fff;font-size:12.5px;padding:4px 0;box-shadow:0 4px 0 rgba(90,74,120,.15)}
.act b{font-size:28px;line-height:1.1;font-weight:400}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,74,120,.15)}
.act.dim{opacity:.5}
/* ---------- modal ---------- */
.modalWrap{position:absolute;inset:0;background:rgba(70,50,110,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px)}
.modalWrap.show{display:flex}
.modal{background:#fffafd;border-radius:30px;width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;padding:18px;box-shadow:0 10px 30px rgba(60,30,90,.3);animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 10px;text-align:center;font-size:24px}
.modal p{text-align:center;margin:6px 0 12px;font-size:17px}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.mrow .btn{flex:1}
.col{display:flex;flex-direction:column;gap:10px}
.bigIco{font-size:110px;text-align:center;margin:6px 0;animation:hop 1.4s ease-in-out infinite}
.tags{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--lav)}
.nameIn{display:flex;gap:8px}
.nameIn input{flex:1;height:54px;border-radius:18px;border:3px solid var(--pink);padding:0 14px;font-weight:800;color:var(--ink);background:#fff;outline:none;min-width:0}
.foods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.food{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78px;border-radius:18px;background:#fff;font-size:12px;box-shadow:0 3px 0 rgba(90,74,120,.12)}
.food b{font-size:34px;font-weight:400}
.mtabs{display:flex;gap:6px;margin-bottom:10px}
.mtabs .tab{flex:1}
.shopList{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:2px 2px 6px;min-height:0}
.item{background:#fff;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(90,74,120,.12)}
.item .pv{font-size:40px;line-height:1.1;height:60px;width:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;position:relative}
.item .in{font-size:14px;text-align:center}
.item .btn{width:100%;min-height:44px;font-size:15px;padding:6px}
.item.eq{box-shadow:0 0 0 3px var(--mint2)}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:18px;padding:8px 8px 8px 16px;font-size:17px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;display:none;flex-direction:column;z-index:40;touch-action:none;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.overlay.show{display:flex}
#game{background:linear-gradient(#2b2a6b,#6a4fb5 60%,#f3a6d0)}
.ghud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff;font-size:22px}
.ghud .pill{color:var(--ink)}
.field{position:relative;flex:1;overflow:hidden;touch-action:none}
.fall{position:absolute;left:0;top:0;width:64px;height:64px;font-size:44px;display:flex;align-items:center;justify-content:center;will-change:transform}
.gpet{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:76px;transition:transform .2s}
.bigText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:90px;text-shadow:0 6px 0 rgba(0,0,0,.2);pointer-events:none;text-align:center}
.gstars{position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff,transparent)}
#bath{background:linear-gradient(#cdefff,#9fd8ff)}
.bhead{text-align:center;padding:12px;font-size:22px}
.tub{position:relative;flex:1;margin:0 12px;border-radius:30px;background:linear-gradient(#e8f8ff,#bfe6ff);overflow:hidden;touch-action:none}
.tub .bpet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:150px;pointer-events:none}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.75) 13% 30%,rgba(200,230,255,.55) 60%,rgba(170,140,255,.45));box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);transform:translate(-50%,-50%);transition:transform .2s,opacity .2s;pointer-events:none}
.bub.pop{transform:translate(-50%,-50%) scale(1.6);opacity:0}
.dirt{position:absolute;border-radius:50%;background:rgba(140,100,60,.55);transform:translate(-50%,-50%);pointer-events:none;transition:opacity .4s}
.bprog{height:16px;background:#fff;border-radius:99px;margin:10px 20px;overflow:hidden}
.bprog i{display:block;height:100%;width:0;background:var(--sky2);transition:width .2s}
.bfoot{display:flex;justify-content:center;padding:6px 0 12px}
#walk{background:linear-gradient(#bfe9ff 0 45%,#a6e3a0 45%)}
.wfield{position:relative;flex:1;overflow:hidden}
.wpath{position:absolute;left:-5%;right:-5%;top:58%;height:22%;background:#f3dfb3;border-radius:50%/30%}
.walker{position:absolute;top:56%;font-size:84px;transform:translate(-50%,-50%);line-height:1}
.walker .ico{animation:hop .6s ease-in-out infinite}
.walker.stop .ico{animation:none}
.wcard{position:absolute;left:12px;right:12px;bottom:14px;background:#fff;border-radius:26px;padding:14px;text-align:center;box-shadow:0 6px 0 rgba(90,74,120,.15);transform:translateY(130%);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.wcard.show{transform:translateY(0)}
.fmeter{height:16px;background:#ffeaf2;border-radius:99px;overflow:hidden;margin:8px 10px}
.fmeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb3cf,#ff6fa5);transition:width .8s}
.lovePair{display:flex;justify-content:center;align-items:center;gap:6px;font-size:84px;margin:8px 0}
.lovePair .h{font-size:44px;animation:pulse .8s ease-in-out infinite}
.wedding{background:linear-gradient(#fff0f7,#ffd6e7)}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-160%);background:#fff;padding:12px 20px;border-radius:999px;font-size:16px;z-index:80;box-shadow:0 6px 18px rgba(90,74,120,.25);transition:transform .35s cubic-bezier(.3,1.4,.5,1);max-width:92%;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#confetti,#flyLayer{position:absolute;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px}
.mood{right:auto;left:10px;top:10px}
.chatBtn{position:absolute;right:10px;top:10px;width:54px;height:54px;border-radius:50%;background:#fff;font-size:27px;z-index:6;box-shadow:0 4px 0 rgba(90,74,120,.18);padding:0}
.chatBtn:active{transform:translateY(3px)}
#chat{position:fixed;left:0;right:0;top:0;height:100%;z-index:45;background:rgba(70,50,110,.35);display:none;flex-direction:column;justify-content:flex-end;touch-action:none}
#chat.show{display:flex}
.cpanel{width:100%;max-width:560px;margin:0 auto;background:#fffafd;border-radius:28px 28px 0 0;display:flex;flex-direction:column;height:72%;max-height:100%;box-shadow:0 -8px 24px rgba(60,30,90,.25);padding-bottom:var(--sab)}
#chat.kb .cpanel{height:100%;border-radius:0;padding-bottom:0}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid #f3e6f7}
.chead .ico{font-size:40px}
.chead .ct{flex:1;font-size:19px;line-height:1.1}
.chead .ct small{display:block;font-size:13px;color:var(--ink2);font-weight:700}
.cmsgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:80%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.3;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.msg.me{align-self:flex-end;background:var(--sky2);color:#fff;border-bottom-right-radius:6px}
.msg.pet{align-self:flex-start;background:#fff;box-shadow:0 2px 0 rgba(90,74,120,.12);border-bottom-left-radius:6px}
.msg.pet.mad{background:#ffe1d6}
.typing span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink2);margin:0 2px;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}
.cin{display:flex;gap:8px;padding:10px 12px;border-top:2px solid #f3e6f7}
.cin input{flex:1;min-width:0;height:50px;border-radius:25px;border:3px solid var(--lav);padding:0 16px;font-weight:700;color:var(--ink);outline:none;background:#fff}
.cin input:focus{border-color:var(--lav2)}
.petBody.mad{animation:madShake .5s ease-in-out 3}
.petBody.mad .pe{filter:saturate(1.4) hue-rotate(-15deg)}
@keyframes madShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg) scale(1.03)}}
/* ---------- kawaii extras ---------- */
:root{--font:"Nunito","Comic Sans MS","Chalkboard SE",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif}
body{font-family:var(--font)}
.btn,.act,.tab,.card,.food,.ptab,.chatBtn{transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.btn:active,.act:active,.tab:active,.card:active,.food:active,.ptab:active{transform:translateY(3px) scale(.94,.9)}
.card:active .ico{animation:wiggle .3s}
@keyframes wiggle{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.btn{box-shadow:0 4px 0 rgba(90,74,120,.15),0 6px 14px rgba(255,143,184,.18)}
.titleIcon{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 16px rgba(90,74,120,.25);margin-bottom:8px;animation:hop 1.8s ease-in-out infinite}
.blush{position:absolute;top:.56em;width:.2em;height:.11em;border-radius:50%;background:radial-gradient(#ff8fb0,rgba(255,143,176,0) 70%);opacity:.75;pointer-events:none}
.blush.l{left:.2em}.blush.r{right:.2em}
.eyeSpark{position:absolute;font-size:.13em;pointer-events:none;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.sparkleBg{position:absolute;pointer-events:none;font-size:16px;animation:twinkle 2.4s ease-in-out infinite;opacity:.6}
/* music box */
.mbox{position:absolute;right:12px;bottom:34px;width:62px;height:56px;z-index:4;padding:0;background:none;box-shadow:none;cursor:pointer}
.mbox .base{position:absolute;left:4px;right:4px;bottom:0;height:34px;border-radius:10px 10px 14px 14px;background:linear-gradient(#ffc2dc,#ff9cc4);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 3px 0 rgba(90,74,120,.2)}
.mbox .base:after{content:"♪";position:absolute;left:0;right:0;top:4px;text-align:center;color:#fff;font-size:18px}
.mbox .lid{position:absolute;left:0;right:0;bottom:30px;height:16px;border-radius:10px 10px 4px 4px;background:linear-gradient(#ffe0ee,#ffb5d3);transform-origin:8% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 0 rgba(90,74,120,.15)}
.mbox .lid:after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#ffd75e}
.mbox.open .lid{transform:rotate(-38deg)}
.mbox .dancer{position:absolute;left:50%;bottom:30px;font-size:16px;transform:translateX(-50%) scale(0);transition:transform .3s}
.mbox.open .dancer{transform:translateX(-50%) scale(1)}
#disco{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;mix-blend-mode:screen;
  background:radial-gradient(circle at 20% 30%,rgba(255,120,200,.5),transparent 35%),radial-gradient(circle at 80% 25%,rgba(120,200,255,.5),transparent 35%),radial-gradient(circle at 50% 80%,rgba(255,230,120,.45),transparent 40%);animation:disco 3s linear infinite}
#disco.on{opacity:1}
@keyframes disco{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.petBody.dance{animation:dance .68s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}25%{transform:translateY(-14%) rotate(0) scale(.96,1.05)}50%{transform:translateY(0) rotate(8deg) scale(1.05,.95)}75%{transform:translateY(-14%) rotate(0)}}
.petBody.sway{animation:sway 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.beatRing{position:absolute;left:50%;top:58%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:6px solid rgba(255,255,255,.85);pointer-events:none;opacity:0}
.danceHud{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;align-items:center;z-index:7}
.musicBar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:7;display:flex;gap:6px;align-items:center}
.musicBar .pill{font-size:14px}
.songs{display:flex;flex-direction:column;gap:8px}
.song{display:flex;align-items:center;gap:10px;min-height:54px;border-radius:18px;background:#fff;padding:8px 14px;font-size:17px;box-shadow:0 3px 0 rgba(90,74,120,.12);text-align:left}
.song b{font-size:26px;font-weight:400}
/* requests */
.reqCard{position:absolute;left:72px;right:72px;top:10px;z-index:8;background:#fff;border-radius:22px;padding:8px 10px;text-align:center;box-shadow:0 5px 0 rgba(90,74,120,.15);animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.reqCard .rt{font-size:15px;line-height:1.2;margin-bottom:6px}
.reqCard .rt b{font-size:22px;display:block}
.reqCard .mrow{margin-top:0;gap:6px}
.reqCard .btn{min-height:44px;font-size:15px;padding:6px 8px}

.swatches{flex:0 0 auto;min-height:58px;align-items:center}

.scrLines{position:absolute;width:22px;height:10px;margin:-2px 0 0 -11px;pointer-events:none;z-index:7;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.95) 3px 5px,transparent 5px 8px);border-radius:4px;animation:scrL .35s ease-out forwards}
@keyframes scrL{from{opacity:.9;transform:scaleX(.6)}to{opacity:0;transform:scaleX(1.3)}}
.petCanvas.scratching{animation:scrWig .2s ease-in-out infinite alternate}
.petCanvas.purring{animation:purrJit .09s linear infinite alternate}
@keyframes scrWig{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(-1px)}}
@keyframes purrJit{from{transform:translate(-1px,0) scale(1.01,.99)}to{transform:translate(1px,1px) scale(.99,1.01)}}
#scrMeter{position:absolute;left:50%;top:58px;width:44%;height:16px;margin:0 0 0 -22%;z-index:6;display:none;pointer-events:none}
#scrMeter b{position:absolute;right:-14px;top:-8px;font-size:22px}
.orbit{position:absolute;pointer-events:none;z-index:7;margin:-12px 0 0 -12px;animation:orbit 2.4s linear infinite;animation-delay:var(--d)}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r)) rotate(0deg) scale(1)}50%{transform:rotate(180deg) translateX(var(--r)) rotate(-180deg) scale(1.25)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg) scale(1)}}
#scrMeter{overflow:visible}#scrMeter i{transition:width .15s;border-radius:99px}
#hudRing.gain{animation:hudGain .5s ease}

/* games menu + arcade */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:58vh;overflow-y:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}

.gcard:active{transform:scale(.93) translateY(2px)}
.gcard b{font-size:38px;line-height:1.1}.gcard span{font-size:14px;font-weight:800;line-height:1.1;text-align:center}.gcard small{font-size:12px;opacity:.7}
#arcade{background:linear-gradient(#ffd6e7,#d9ecff)}
#arcade .ghud{color:var(--ink);font-weight:800}
#arQuit{border:0;font:inherit;min-width:48px;min-height:44px}
#arCv{display:block;touch-action:none}
.arRes{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(90,60,120,.35);z-index:5}

.arCard{background:#fff;border-radius:28px;padding:18px 18px 16px;width:min(88%,340px);text-align:center;box-shadow:0 10px 30px rgba(90,60,120,.3);animation:arPop .35s}

</style>
</head>

  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
function noise(start, dur, vol = 0.15, freq = 1200) {
  if (!S.sound) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + start, len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);

  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;

}

const STAGES = [{ n: 'Baby', from: 1, scale: 0.72 }, { n: 'Kid', from: 5, scale: 0.9 }, { n: 'Grown-up', from: 10, scale: 1.08 }];
const stageOf = p => p.level >= 10 ? STAGES[2] : p.level >= 5 ? STAGES[1] : STAGES[0];
const MAX_LEVEL = 1000000000; // one billion
// XP needed grows each level (slow & special) but is capped so it stays a sane finite number at huge levels
const xpNeed = l => { const n = Math.max(0, Math.min(Number(l) || 1, MAX_LEVEL) - 1); return Math.round(Math.min(5000, 40 + 25 * n + 5 * n * n)); };

const FLOOR = 5;
function decay(p, dt) {
  const h = dt / 3600, s = p.st;
  if (p.asleep) {
    s.energy += 1.2 * dt; s.hunger -= 2.5 * h; s.happy -= 1 * h; s.clean -= 1 * h;
    if (s.energy >= 100) { s.energy = 100; p.asleep = false; p.justWoke = true; }
  } else {
    s.hunger -= 5 * h; s.happy -= 4 * h; s.energy -= 3 * h; s.clean -= 3 * h;
  }
  for (const k in s) s[k] = clamp(s[k], FLOOR, 100);
}

function addCoins(n) { S.coins = Math.max(0, S.coins + n); renderCoins(); }
function addXP(p, n) {
  if (!(n > 0)) return;
  if (!(p.level >= 1)) p.level = 1;
  if (!(p.xp >= 0)) p.xp = 0;
  if (p.level >= MAX_LEVEL) { p.level = MAX_LEVEL; p.xp = 0; renderTop(); return; }
  const fromLevel = p.level, fromXp = p.xp, oldStage = stageOf(p).n;
  p.xp += n; const ups = [];
  let guard = 0;
  while (p.xp >= xpNeed(p.level) && p.level < MAX_LEVEL && guard++ < 1000) { p.xp -= xpNeed(p.level); p.level++; ups.push(p.level); }
  if (p.level >= MAX_LEVEL) { p.level = MAX_LEVEL; p.xp = 0; }
  if (ups.length) {
    const ns = stageOf(p).n, grew = ns !== oldStage;
    ups.forEach(lvl => levelReward(p, lvl));
    setTimeout(() => levelUpParty(p, p.level, grew, ns), 200);

}

    if (free) { S.owned.push(free.id); gift = free.n; }

/* ===== Star Catch mini-game ===== */
const G = { on: false, score: 0, items: [], raf: 0, t0: 0, lastSpawn: 0, dur: 20000, ended: false };
$('#aPlay').addEventListener('click', () => {
  SFX.tap(); if (blockedAsleep()) return;

function startGame() {
  stopListen(); stopDance(true);
  const p = curPet();
  $('#game').classList.add('show');
  $('#gPet').innerHTML = petIcon(p);
  G.items.forEach(it => it.el.remove()); G.items = []; G.score = 0; G.ended = false;
  $('#gScore').textContent = '⭐ 0'; $('#gTime').textContent = '⏱️ ' + G.dur / 1000;
  updateMusic();
  const big = $('#gBig'); let n = 3; big.innerHTML = 'Tap the falling treats!<br>3';
  big.style.fontSize = '40px';
  const cd = setInterval(() => {
    n--; SFX.tap();
    if (n > 0) big.innerHTML = 'Tap the falling treats!<br>' + n;
    else { clearInterval(cd); big.textContent = 'GO! 🌟'; setTimeout(() => { if (!G.ended) big.textContent = ''; }, 600); G.on = true; G.t0 = performance.now(); G.lastSpawn = 0; G.raf = requestAnimationFrame(gameLoop); }
  }, 800);
}
const FALLERS = [['⭐', 1], ['⭐', 1], ['🍬', 1], ['🍪', 1], ['🌟', 2], ['💖', 2], ['💎', 3]];
let gPrev = 0;
function gameLoop(ts) {
  if (!G.on) return;
  const el = ts - G.t0, f = $('#field'), W = f.clientWidth, H = f.clientHeight;
  const dt = gPrev ? Math.min(50, ts - gPrev) / 1000 : 0; gPrev = ts;
  const left = Math.max(0, Math.ceil((G.dur - el) / 1000));
  $('#gTime').textContent = '⏱️ ' + left;
  if (el - G.lastSpawn > Math.max(380, 700 - el / 60)) {
    G.lastSpawn = el;
    const [e, v] = pick(FALLERS);
    const d = document.createElement('div'); d.className = 'fall'; d.textContent = e;
    const it = { el: d, x: rnd(6, W - 70), y: -64, v: rnd(110, 170) + el / 200, val: v, wob: rnd(0, 6) };
    d.addEventListener('pointerdown', ev => { ev.preventDefault(); catchItem(it); });
    f.appendChild(d); G.items.push(it);
  }
  G.items = G.items.filter(it => {
    if (it.dead) return false;
    it.y += it.v * dt;
    it.el.style.transform = `translate(${it.x + Math.sin(it.y / 40 + it.wob) * 10}px,${it.y}px)`;
    if (it.y > H) { it.el.remove(); return false; }
    return true;
  });
  if (el >= G.dur) { endGame(); return; }
  G.raf = requestAnimationFrame(gameLoop);
}
function catchItem(it) {
  if (it.dead || !G.on) return;
  it.dead = true; G.score += it.val;
  SFX.catch(G.score);
  const f = $('#field');
  floatFx(f, '+' + it.val, it.x + 32, it.y + 20, { size: 26, color: '#ffd75e', dx: 0, dy: -60, dur: 700 });
  floatFx(f, '✨', it.x + 32, it.y + 32, { size: 30, dur: 500 });

const B = { bubbles: [], total: 0, rubbing: false, lastPop: 0, done: false };
$('#aBath').addEventListener('click', () => { SFX.tap(); if (blockedAsleep()) return; startBath(); });
function startBath() {
  stopListen(); stopDance(true);
  const p = curPet(), tub = $('#tub');
  $('#bath').classList.add('show');
  const fs = Math.min(tub.clientWidth * 0.45, tub.clientHeight * 0.4, 170);
  tub.innerHTML = `<div class="bpet" style="font-size:${fs}px">${petIcon(p)}</div>`;
  const W = tub.clientWidth, H = tub.clientHeight;
  if (p.st.clean < 70) for (let i = 0; i < 6; i++) {
    const d = document.createElement('div'); d.className = 'dirt'; const s = rnd(14, 26);
    Object.assign(d.style, { left: (W / 2 + rnd(-fs * .4, fs * .4)) + 'px', top: (H / 2 + rnd(-fs * .4, fs * .4)) + 'px', width: s + 'px', height: s + 'px' }); tub.appendChild(d);
  }
  B.bubbles = []; B.done = false;
  const n = 26;
  for (let i = 0; i < n; i++) {
    const s = rnd(46, 84), a = rnd(0, Math.PI * 2), r = rnd(0, 1) * fs * 0.75;
    const x = clamp(W / 2 + Math.cos(a) * r, s / 2, W - s / 2), y = clamp(H / 2 + Math.sin(a) * r * 1.1, s / 2, H - s / 2);
    const d = document.createElement('div'); d.className = 'bub';
    Object.assign(d.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px' });
    tub.appendChild(d); B.bubbles.push({ el: d, x, y, r: s / 2 });
  }
  B.total = n; bathProgress();
}
function bathProgress() { const left = B.bubbles.filter(b => !b.popped).length; $('#bProg').style.width = ((B.total - left) / B.total * 100) + '%'; return left; }
function rubAt(cx, cy) {
  if (B.done) return;
  const r = $('#tub').getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  let popped = 0;
  B.bubbles.forEach(b => {
    if (b.popped) return;
    if (Math.hypot(b.x - x, b.y - y) < b.r + 26) { b.popped = true; b.el.classList.add('pop'); setTimeout(() => b.el.remove(), 220); popped++; }
  });
  if (popped) {
    const now = performance.now(); if (now - B.lastPop > 60) { SFX.bubble(); B.lastPop = now; }
    const left = bathProgress();
    const fade = 1 - (B.total - left) / B.total; document.querySelectorAll('#tub .dirt').forEach(d => d.style.opacity = fade);
    if (left === 0) finishBath(true);
  }
}
$('#tub').addEventListener('pointerdown', e => { e.preventDefault(); B.rubbing = true; rubAt(e.clientX, e.clientY); });
$('#tub').addEventListener('pointermove', e => { if (B.rubbing || e.buttons || e.pointerType === 'touch') rubAt(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => { B.rubbing = false; });
window.addEventListener('pointercancel', () => { B.rubbing = false; });
$('#bDone').addEventListener('click', () => { SFX.tap(); finishBath(false); });
function finishBath(complete) {
  if (B.done) return; B.done = true;
  const p = curPet(), frac = (B.total - B.bubbles.filter(b => !b.popped).length) / B.total;
  addStat(p, 'clean', complete ? 100 : 60 * frac); addStat(p, 'happy', 8 * Math.max(frac, .3));
  addXP(p, Math.round(12 * frac)); if (frac > .5) { p.ticks = []; careDone(); setTimeout(() => earn(4), 1200); }
  if (complete) { SFX.sparkle(); const tub = $('#tub'); for (let i = 0; i < 10; i++) floatFx(tub, pick(['✨', '🌟', '💖']), tub.clientWidth / 2 + rnd(-90, 90), tub.clientHeight / 2 + rnd(-60, 60)); }
  if (frac > .5) fulfillRequest('bath');
  save();
  setTimeout(() => { $('#bath').classList.remove('show'); renderAll(); bounce(); say(complete ? 'Squeaky clean! ✨🛁' : 'A little cleaner! 🫶'.replace('🫶', '💦')); }, complete ? 1100 : 150);
}

const SOUNDS = [
  [/dog|pup|wolf/i, 'Woof woof!'], [/cat|kitty|tiger|lion|leopard|sphinx|chimera/i, 'Meow!'], [/fox|kitsune/i, 'Yip yip!'],
  [/bunny|hamster|mouse|squirrel|beaver|jackalope|hedgehog|raccoon/i, 'Squeak!'], [/dragon|wyvern|hydra|dino|nessie|rex|lizard/i, 'Rawr!'],
  [/unicorn|horse|pegasus|zebra|hippogriff/i, 'Neigh~!'], [/cow/i, 'Moo!'], [/pig/i, 'Oink oink!'], [/sheep|goat|llama/i, 'Baa~!'],
  [/frog/i, 'Ribbit!'], [/duck|swan/i, 'Quack!'], [/owl/i, 'Hoot hoot!'], [/bee/i, 'Bzzz!'], [/snake|serpent/i, 'Hiss~ (a nice hiss!)'],
  [/penguin|seal|otter/i, 'Arf arf!'], [/whale|dolphin|fish|shark|octopus|kraken|crab/i, 'Blub blub!'],
  [/phoenix|bird|eagle|parrot|chick|flamingo|peacock|griffin|thunderbird|dove/i, 'Tweet tweet!'], [/bear|panda|koala|yeti|bigfoot|gorilla/i, 'Grr-huggy!'],
  [/monkey|orangutan/i, 'Ooh ooh ah ah!'], [/elephant|mammoth/i, 'Pawoo!'], [/alien/i, 'Bleep bloop!'], [/robo/i, 'Beep boop!'], [/ghost/i, 'Boo~!'],
];
function speciesSound(p) { const a = animalById(p.kind); for (const [re, s] of SOUNDS) if (re.test(a.n)) return s; return 'Squee!'; }
const CHAT_RULES = [
  [/\b(hi|hello|hey|hiya|yo|good morning|morning)\b/i, ['Hi hi! I missed you! {e}', 'Hello, best buddy! 👋{e}', 'Yay, you’re here! 💖']],
  [/\b(love|luv|❤|💖|hug|cuddle)/i, ['I love you too! {e}💕', 'Big squishy hug! 🤗💖', 'You’re my favorite person ever! 💕']],
  [/\b(food|hungry|eat|snack|treat|dinner|lunch|breakfast|yum|cookie|cake)/i, ['Snacks?! Yes please! 🍪', 'My tummy says rumble rumble! 🍎', 'Can we have a treat? 😋']],
  [/\b(play|game|fun|ball|toy|catch)/i, ['Let’s play Star Catch! ⭐', 'Playtime is the best time! 🎈', 'Catch me if you can! 🏃']],
  [/\b(sleep|tired|nap|bed|night|sleepy)/i, ['*yawn* A nap sounds cozy... 😴', 'Sing me a lullaby? 🌙', 'Sweet dreams together! 💤']],
  [/\b(walk|park|outside|friend)/i, ['A walk?! Let’s go to the park! 🌳', 'I want to see my friends! 🐾', 'Walkies! 🌼']],
  [/\b(name|who are you|your name)/i, ['My name is {name}! 💖', 'I’m {name}, your best buddy! ✨']],
  [/how are you|how r u|you ok|how do you feel/i, ['__mood__']],
  [/good (boy|girl|pet|buddy)|good job|well done|cute|pretty|smart|best/i, ['Aww, thank you! *wiggle wiggle* 🥰', 'You’re making me blush! ☺️💕', 'Hehe, you’re the best too! ⭐']],
  [/\b(sad|cry|upset|bad day|lonely)/i, ['Oh no! Here’s a big hug 🤗💖', 'I’m here for you, always! 💕', 'Want to tickle me? It always helps! 😊']],
  [/birthday|bday|party/i, ['Party time! 🎂🎉', 'Can we have cake?! 🍰', 'Happy happy birthday! 🥳']],
  [/dance|music|song|sing/i, ['Let’s dance! Tap my music box! 🎶', 'La la la~ 🎵', 'I love music! 💃']],
  [/bath|clean|stinky|wash/i, ['Bubbles!! 🛁', 'Splish splash! 💦']],
  [/\?\s*$/, ['Hmm... I think YES! ✨', 'Ooh, good question! 🤔 Maybe!', 'I don’t know, but I love you! 💖', 'Let me think... yes yes! 😄']],
];
const GENERIC = ['Hehe! {e}', 'Tell me more! 😊', 'You’re so fun! 💖', 'Best buddies forever! 🌈', 'Yay! ✨', 'I like talking with you! 💕'];
const GRUMPY = ['Hmph! I’m grumpy right now 😤', 'Not now... I’m a little cranky 😾', 'Grr! I need some love first 😤', 'Hmph. Maybe later! 🙄', 'I’m in a huffy mood! 😠'];
function moodLine(p) {
  const s = p.st;
  if (s.hunger < 35) return 'My tummy is grumbly... 🍎';
  if (s.energy < 30) return 'I’m soooo sleepy 😴';
  if (s.clean < 35) return 'I feel a bit stinky 🛁';
  if (s.happy < 40) return 'A little lonely... play with me? 🥺';
  return 'I’m super happy! {e}😄';
}
function petReply(p, text) {

  if (Math.random() < grumpChance) {
    let r = pick(GRUMPY);
    if (s.hunger < 30) r += ' Feed me? 🍎'; else if (s.energy < 25) r += ' I need a nap...'; else if (s.happy < 30) r += ' Tickle me? 🥺';
    return { text: r, mad: true };
  }
  let line = null;
  for (const [re, lines] of CHAT_RULES) if (re.test(text)) { line = pick(lines); break; }
  if (!line) line = pick(GENERIC);
  if (line === '__mood__') line = moodLine(p);
  const a = animalById(p.kind);
  line = line.replace('{name}', p.name).replace('{e}', a.e);
  if (Math.random() < 0.7) line = speciesSound(p) + ' ' + line;

}

function dclock() { return AC && AC.state === 'running' ? AC.currentTime : performance.now() / 1000; }
function startDance() {
  stopListen();
  const p = curPet(); dance.on = true; dance.hits = 0; dance.taps = 0; dance.judged = {};
  openBox(true); $('#disco').classList.add('on'); $('#petBody').classList.add('dance');
  updateMusic();
  dance.beat = 60 / THEMES.dance.bpm; dance.t0 = dclock() + 0.1; dance.end = dance.t0 + 20;
  stageUI(`<div class="danceHud"><span class="pill" id="dScore">💃 0</span><span class="pill">Tap on the beat! 💓</span><button class="btn" id="dStop">⏹️</button></div>`);
  $('#dStop').onclick = e => { e.stopPropagation(); SFX.tap(); stopDance(); };
  $('#dStop').addEventListener('pointerdown', e => e.stopPropagation());
  say('Dance party!! 💃🪩'.replace('🪩', '✨'));
  dance.raf = requestAnimationFrame(danceLoop);

function danceLoop() {
  if (!dance.on) return;

    dance.lastBeatShown = k;

    if (k % 2 === 0) { const st = $('#stage'); floatFx($('#fx'), pick(['✨', '⭐', '💖', '🌟', '🎵']), rnd(20, st.clientWidth - 20), rnd(20, st.clientHeight * .6), { size: 22, dur: 900 }); }
  }
  if (t >= dance.end) { stopDance(); return; }
  dance.raf = requestAnimationFrame(danceLoop);
}
function danceTap(x, y) {
  const t = dclock(), rel = (t - dance.t0) / dance.beat, k = Math.round(rel), off = Math.abs(rel - k) * dance.beat;
  dance.taps++;
  if (off < 0.16 && !dance.judged[k]) {
    dance.judged[k] = 1; dance.hits++;
    floatFx($('#fx'), off < 0.07 ? 'Perfect! 💖' : 'Nice! ✨', x, y, { size: 20, color: '#ff6fa5', dx: 0, dy: -70, dur: 800 });
    tone(off < 0.07 ? 1319 : 1047, 0, 0.12, 'sine', 0.12);
    $('#dScore').textContent = '💃 ' + dance.hits;
  } else floatFx($('#fx'), '♪', x, y, { size: 22, dur: 600 });
}
function stopDance(silent) {

/* ===== Pet requests ===== */
let nextReqAt = Date.now() + 45000;
const REQ_TYPES = ['dance', 'song', 'walk', 'toy', 'treat', 'bath', 'game', 'outfit', 'nap', 'cuddles'];
function makeRequest(p) {
  let types = REQ_TYPES.slice();
  const ownedAcc = ACCESSORIES.filter(a => S.owned.includes(a.id) && p.acc[a.slot] !== a.id);
  if (!ownedAcc.length) types = types.filter(t => t !== 'outfit');
  if (p.st.energy > 70) types = types.filter(t => t !== 'nap');
  if (p.st.energy < 15) types = ['nap', 'song', 'cuddles', 'treat'];
  const type = pick(types), r = { type, t: Date.now() };
  if (type === 'treat') r.food = pick(FOODS).n;
  if (type === 'outfit') r.acc = pick(ownedAcc).id;
  if (type === 'toy') r.toy = pick(['⚽ ball', '🧸 teddy', '🪀 yo-yo'.replace('🪀', '🎈'), '🪁 kite'.replace('🪁', '🎈')]);
  if (type === 'cuddles') r.count = 0;
  return r;
}
function reqText(r) {
  switch (r.type) {
    case 'dance': return ['💃', 'Can we have a dance party?'];
    case 'song': return ['🎶', 'Can I listen to a song?'];
    case 'walk': return ['🌳', 'Can we go for a walk?'];
    case 'toy': return ['🧸', `I want to play with my ${r.toy}! (Play)`];
    case 'treat': { const f = FOODS.find(x => x.n === r.food); return [f.e, `I'm craving a ${f.n.toLowerCase()}!`]; }
    case 'bath': return ['🛁', 'Bubble bath time?'];
    case 'game': return ['⭐', "Let's play Star Catch!"];
    case 'outfit': { const a = accById(r.acc); return [a.e, `Can I wear my ${a.n}?`]; }
    case 'nap': return ['🌙', "I'd like a cozy nap..."];
    case 'cuddles': return ['🤗', 'Cuddles please! (tap me 5 times)'];
  }
  return ['💖', 'Hi!'];
}
function showRequestCard() {
  const p = curPet(), r = p && p.req; if (!r) { stageUI(listenTheme || dance.on ? $('#stageUI').innerHTML : ''); return; }
  const [e, t] = reqText(r);
  if (r.accepted) { if (!listenTheme && !dance.on) stageUI(`<div class="pill reqPending">💭 ${e} ${esc(t.length > 26 ? t.slice(0, 24) + '…' : t)}</div>`); return; }
  stageUI(`<div class="reqCard" id="reqCard"><div class="rt"><b>💭 ${e}</b>${esc(t)}</div><div class="mrow"><button class="btn pink" id="rYes">Okay! 💖</button><button class="btn" id="rLater">Later</button></div></div>`);
  const card = $('#reqCard'); card.addEventListener('pointerdown', ev => ev.stopPropagation());
  $('#rYes').onclick = () => { SFX.tap(); acceptRequest(); };
  $('#rLater').onclick = () => { SFX.tap(); p.req = null; nextReqAt = Date.now() + rnd(120000, 180000); stageUI(''); save(); say('Okay, maybe later! 😊'); };
}
function petWalksToBox(cb) {
  const w = $('#petWrap');
  const anim = w.animate([{ left: '50%' }, { left: '68%' }, { left: '68%' }, { left: '50%' }], { duration: 2600, easing: 'ease-in-out' });
  setTimeout(() => { petAct('paw', 1100); openBox(true); tone(1047, 0, .3, 'sine', .12); tone(1319, .15, .3, 'sine', .12); const st = $('#stage');
    for (let i = 0; i < 5; i++) setTimeout(() => floatFx($('#fx'), pick(['🎵', '🎶', '♪']), st.clientWidth - 44, st.clientHeight - 70, { size: 24, dur: 1400 }), i * 150); }, 1000);
  setTimeout(() => { openBox(false); }, 2200);
  anim.onfinish = cb;
}
function maybeRequest() {
  const p = curPet();
  if (!p || p.req || p.asleep || modalOpen() || anyOverlay() || listenTheme || !$('#scrPet').classList.contains('active')) return;
  if (Date.now() < nextReqAt) return;
  nextReqAt = Date.now() + rnd(120000, 180000);
  p.req = makeRequest(p); save();
  const go = () => { SFX.chatPop(); const [e] = reqText(p.req); say(`${e} I have a wish!`); showRequestCard(); };
  if (p.req.type === 'dance' || p.req.type === 'song') petWalksToBox(go); else go();
}
function acceptRequest() {
  const p = curPet(), r = p.req; if (!r) return;
  r.accepted = true; save(); stageUI('');
  switch (r.type) {
    case 'dance': startDance(); break;
    case 'song': startListen(pick(SONGS)[0]); break;
    case 'walk': startWalk(); break;
    case 'toy': case 'game': startGame(); break;
    case 'treat': $('#aFeed').click(); break;
    case 'bath': startBath(); break;
    case 'outfit': equip(r.acc); fulfillRequest('outfit'); break;
    case 'nap': sleep(); fulfillRequest('nap'); break;
    case 'cuddles': showRequestCard(); say('Tap me for cuddles! 🤗'); break;
  }
}
function fulfillRequest(type, detail) {
  const p = curPet(), r = p && p.req; if (!r) return;
  let ok = r.type === type || (type === 'game' && r.type === 'toy');
  if (ok && r.type === 'treat') ok = detail === r.food;
  if (ok && r.type === 'cuddles') { r.count = (r.count || 0) + 1; ok = r.count >= 5; if (!ok) { save(); return; } }
  if (!ok) return;
  p.req = null; addCoins(10); addStat(p, 'happy', 15); addXP(p, 20); save();
  setTimeout(() => {
    SFX.love(); confetti(40); toast(`💝 Wish granted! +10 🪙 +20 XP`, 2400);
    if ($('#scrPet').classList.contains('active') && !anyOverlay()) { say(pick(['Thank you sooo much! 💖', 'You made my wish come true! ✨', 'Yay! You’re the best! 🥰'])); bounce(); }
    if (!listenTheme && !dance.on) stageUI('');
  }, 400);
}

/* --- floor messes --- */
const MESS_TYPES = [
  { k: 'crumbs', html: '<span>🍪🍪</span>', n: 'crumbs' }, { k: 'puddle', html: '<span></span>', n: 'puddle' },
  { k: 'toy', html: '<span>🧸</span>', n: 'toy' }, { k: 'toy', html: '<span>⚽</span>', n: 'ball' },
  { k: 'dust', html: '<span>☁️</span>', n: 'dust bunny' }, { k: 'toy', html: '<span>🧦</span>', n: 'sock' },
];
let nextMessAt = Date.now() + rnd(30000, 50000);
function addMess(p) {
  if (!p.messes) p.messes = [];
  if (p.messes.length >= 5) return;
  let x, y, tries = 0;
  do { x = rnd(12, 76); y = rnd(74, 92); tries++; } while (tries < 20 && (p.messes.some(m => Math.abs(m.x - x) < 12 && Math.abs(m.y - y) < 8) || Math.abs(x - 50) < 14));
  p.messes.push({ t: Math.floor(Math.random() * MESS_TYPES.length), x, y, id: Date.now() + Math.random() });
}
function renderMesses() {
  const p = curPet(); if (!p) return;
  p.messes = p.messes || [];
  $('#messes').innerHTML = p.messes.map(m => { const T2 = MESS_TYPES[m.t] || MESS_TYPES[0]; return `<div class="mess ${T2.k}" data-id="${m.id}" style="left:${m.x}%;top:${m.y}%" aria-label="${T2.n}">${T2.html}</div>`; }).join('');
}
function cleanMess(el) {
  const p = curPet(); if (!el || el.classList.contains('gone')) return;
  const id = +el.dataset.id; p.messes = (p.messes || []).filter(m => m.id !== id);
  el.classList.add('gone'); setTimeout(() => el.remove(), 320);
  const st = $('#stage').getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = r.left + r.width / 2 - st.left, y = r.top - st.top;
  for (let i = 0; i < 4; i++) floatFx($('#fx'), pick(['✨', '🌟', '💫']), x + rnd(-15, 15), y + 10, { size: 22, dur: 700 });
  SFX.sparkle(); earn(3, x, y); addStat(p, 'happy', 2); addXP(p, 2); careDone(); save();
  if (!p.messes.length) setTimeout(() => say('So tidy! Thank you! ✨'), 300);
}
$('#messes').addEventListener('pointerdown', e => { const m = e.target.closest('.mess'); if (m) { e.stopPropagation(); cleanMess(m); } });
$('#stage').addEventListener('pointermove', e => { // swipe across messes to clean
  if (!e.buttons && e.pointerType !== 'touch') return;
  const el = document.elementFromPoint(e.clientX, e.clientY); const m = el && el.closest && el.closest('.mess'); if (m) cleanMess(m);
});

/* --- ticks on the pet (tap to remove) --- */
const TICK_SPOTS = [[-.55, -.25], [.5, -.1], [-.3, .45], [.4, .5], [0, -.55], [-.7, .2]]; // relative to the body
let nextTickAt = Date.now() + rnd(60000, 120000);
function renderTicks() {
  const p = curPet(), b = $('#petBody'); if (!p || !b || !PA.size) return;
  b.querySelectorAll('.tickHit').forEach(t => t.remove());
  const an = petAnchors(animalById(p.kind)), S2 = PA.size, [bx, by, brx, bry] = an.body;
  (p.ticks || []).forEach(i => {
    const [dx, dy] = TICK_SPOTS[i]; const h = document.createElement('div'); h.className = 'tickHit'; h.dataset.i = i;
    h.style.left = (bx + dx * brx) * S2 + 'px'; h.style.top = (by + dy * bry) * S2 + 'px';
    h.style.fontSize = S2 + 'px'; h.innerHTML = '<span class="tick" style="position:relative"></span>';
    b.appendChild(h);
  });
}
$('#petBody').addEventListener('pointerdown', e => {
  const t = e.target.closest('.tickHit'); if (!t) return;
  e.stopPropagation(); const p = curPet();
  p.ticks = (p.ticks || []).filter(i => i !== +t.dataset.i);
  const st = $('#stage').getBoundingClientRect(), r = t.getBoundingClientRect();
  t.remove(); SFX.bubble(); earn(2, r.left - st.left, r.top - st.top); addXP(p, 3); careDone(); save();
  say(p.ticks.length ? 'Ouchie... more please! 🙏' : 'Thank you! All better! 💖');
});
function maybeTicks(p) {
  if (Date.now() < nextTickAt || p.asleep) return;
  nextTickAt = Date.now() + rnd(90000, 180000);
  if (p.st.clean < 70 || Math.random() < 0.35) {
    p.ticks = p.ticks || []; const free = TICK_SPOTS.map((_, i) => i).filter(i => !p.ticks.includes(i));
    const n = Math.min(free.length, 1 + Math.floor(Math.random() * 2));
    for (let k = 0; k < n; k++) p.ticks.push(free.splice(Math.floor(Math.random() * free.length), 1)[0]);
    renderTicks(); save(); say('Itchy! Something is on me! 🐛 Tap to help!'.replace('🐛', '😣'));
  }
}
function earnTick() {
  const p = curPet(); if (!p || !$('#scrPet').classList.contains('active') || anyOverlay() || modalOpen()) return;
  if (Date.now() > nextMessAt) { nextMessAt = Date.now() + rnd(40000, 70000); if (!p.asleep) { addMess(p); renderMesses(); save(); } }
  maybeTicks(p);
}

  /* Memory Match: 6 pairs, board refreshes when cleared, 60 seconds */

    draw(s, c, W, H) {

  /* Hide and Seek: buddy hides under a bush, the bushes swap, tap the right one */
  hide: {
    init(s, W, H) { s.useHearts = 1; s.round = 0; this.next(s, W, H); },
    next(s, W, H) {

    slotPos(s, i, W, H) { const cols = s.n, y = H * .55 + (i % 2) * 40 - 20; return [W / (cols + 1) * (i + 1), y]; },
    layout(s, W, H) { s.spots.forEach(sp => { [sp.x, sp.y] = this.slotPos(s, sp.slot, W, H); }); },
    tap(s, x, y) {

      if (i === s.pet) { arcScore(1, sp.x, sp.y - 80, 'Found you! +1'); SFXG.get(); SFX.giggle(); } else { s.wrong = i; hurt(s, sp.x, sp.y - 60); }
    },
    update(s, dt, W, H) {

    draw(s, c, W, H) {

  },
  /* Fishing: tap when the bobber dips */
  fish: {
    init(s) { s.time = 40; this.cast(s); s.catch = null; },
    cast(s) { s.state = 'wait'; s.wait = rnd2(1.2, 3.2); s.pt = 0; },

      c.fillStyle = '#b07a4a'; c.fillRect(0, wy - 12, W * .35, 18); c.fillRect(W * .05, wy, 10, 60); c.fillRect(W * .28, wy, 10, 60);

  /* Running Dash */
  dash: {

    tap(s) { if (s.jumps < 2) { s.vy = -620; s.jumps++; SFXG.jump(); } },
    update(s, dt, W, H) {

    },
  },
  /* Sky Flap */
  flap: {
    init(s, W, H) { s.useHearts = 1; s.y = H * .4; s.vy = 0; s.p = []; s.next = .6; s.started = 0; },

function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px - ax - t * dx, py - ay - t * dy); }

/* ===== main loop & init ===== */
function tick() {
  const now = Date.now();
  let dt = (now - S.lastTick) / 1000;
  if (!(dt >= 0)) dt = 0;
  dt = Math.min(dt, 7 * 86400); // cap offline catch-up at a week
  S.lastTick = now;
  S.pets.forEach(p => decay(p, dt));
  const p = curPet();
  if (p && p.justWoke) { p.justWoke = false; if ($('#scrPet').classList.contains('active')) { SFX.wake(); bounce(); say('Good morning! I feel great! ☀️'); updateMusic(); } }

function decorateStage() {

  $('#sparkles').innerHTML = [[8, 40], [92, 46], [30, 8], [70, 30], [50, 90], [18, 66]].map(([x, y], i) =>
    `<div class="sparkleBg" style="left:${x}%;top:${y}%;animation-delay:${i * 0.4}s">${sp[i % sp.length]}</div>`).join('');
}
function init() {
  load();
  { const away = Date.now() - S.lastTick; S.pets.forEach(p => { const n = Math.min(3, Math.floor(away / 600000)); for (let i = 0; i < n; i++) addMess(p); }); }

  $('#hudRing').addEventListener('click', () => { const p = curPet(); if (!p) return; SFX.tap(); const big = $('#bigRing'); $('#bigRingTxt').innerHTML = p.level >= MAX_LEVEL ? `<small>MAX LEVEL</small><span class="maxN">${fmt(MAX_LEVEL)}</span>` : `<small>Level</small>${fmt(p.level)}<small>${Math.floor(p.xp)} / ${xpNeed(p.level)} XP</small>`; setRing(big.querySelector('.rfill'), ringFrac(p), false); big.classList.add('show'); clearTimeout(ringHide); ringHide = setTimeout(() => big.classList.remove('show'), 2200); });
  $('#btnStyle').addEventListener('click', () => { SFX.tap(); if (!blockedAsleep()) openGroomer(); });
